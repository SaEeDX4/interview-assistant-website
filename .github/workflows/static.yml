# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Minify CSS and JS
        # Step 46: the repository keeps readable sources; only the
        # deployed artifact is minified. The tools are pinned so the
        # output is reproducible byte-for-byte from a local build —
        # tests/reverify46.py rebuilds the same artifacts and compares
        # them against the live files. If this step fails, the deploy
        # stops and the previous version stays live.
        # Bucket-A fix run (A11): avatar.js and spotlight.js are
        # minified too — they used to deploy as readable sources
        # (~53 KB combined) while app.js beside them was minified.
        run: |
          npx --yes terser@5.51.2 website/app.js --compress --mangle -o website/app.min.js
          mv website/app.min.js website/app.js
          npx --yes terser@5.51.2 website/avatar.js --compress --mangle -o website/avatar.min.js
          mv website/avatar.min.js website/avatar.js
          npx --yes terser@5.51.2 website/spotlight.js --compress --mangle -o website/spotlight.min.js
          mv website/spotlight.min.js website/spotlight.js
          npx --yes clean-css-cli@5.6.3 -o website/styles.min.css website/styles.css
          mv website/styles.min.css website/styles.css
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the website folder
          path: 'website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
